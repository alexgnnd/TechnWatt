backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Nouvel article : {{slug}}"
    update: "Modification : {{slug}}"
    delete: "Suppression : {{slug}}"
    uploadMedia: "Photo ajoutée : {{path}}"
    deleteMedia: "Photo supprimée : {{path}}"

locale: fr
site_url: /
display_url: /
logo_url: /img/logo-admin.svg
media_folder: img
public_folder: /img

i18n:
  structure: multiple_folders
  locales: [fr, en]
  default_locale: fr

collections:
  - name: articles
    label: Articles
    label_singular: article
    folder: content/articles
    i18n: true
    create: true
    slug: "{{slug}}"
    summary: "{{titre}} · {{rubrique}} · {{date}}"
    sortable_fields: [date, titre, rubrique]
    view_filters:
      - { label: "Watt · Actualités", field: rubrique, pattern: watt-actualites }
      - { label: "Watt · À bord", field: rubrique, pattern: watt-a-bord }
      - { label: "Tech · Smartphones", field: rubrique, pattern: tech-smartphones }
      - { label: "Tech · Objets connectés", field: rubrique, pattern: tech-objets }
      - { label: "Tech · Vidéoprojecteurs", field: rubrique, pattern: tech-videoprojecteurs }
      - { label: "À la une", field: une, pattern: true }
    fields:
      - { label: Titre, name: titre, widget: string, i18n: true, required: false, hint: "Obligatoire en français. En anglais, laissez vide pour garder la version française." }
      - label: Rubrique
        name: rubrique
        i18n: duplicate
        widget: select
        options:
          - { label: "Watt · Actualités", value: watt-actualites }
          - { label: "Watt · À bord", value: watt-a-bord }
          - { label: "Tech · Smartphones", value: tech-smartphones }
          - { label: "Tech · Objets connectés", value: tech-objets }
          - { label: "Tech · Vidéoprojecteurs", value: tech-videoprojecteurs }
      - { label: "Date de publication", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Les articles les plus récents s'affichent en premier.", i18n: duplicate }
      - { label: "Catégorie (ou marque pour À bord)", name: categorie, widget: string, required: false, hint: "Ex. : Nouveau modèle, Smartphone, Renault…", i18n: true }
      - { label: "Infos sous le titre (À bord)", name: infos, widget: string, required: false, hint: "Ex. : Citadine · Made in Slovénie", i18n: true }
      - { label: "Photo principale", name: image, widget: image, required: false, i18n: duplicate }
      - { label: "Crédit photo", name: credit, widget: string, required: false, hint: "Ex. : Renault (le © est ajouté automatiquement)", i18n: duplicate }
      - { label: "Chapô (introduction)", name: chapo, widget: text, required: false, i18n: true }
      - { label: "Texte de l'article", name: body, widget: markdown, buttons: [bold, italic, link, heading-two, bulleted-list], editor_components: [image], hint: "Utilisez « Titre 2 » pour les intertitres. Insérez les photos à l'endroit voulu.", i18n: true }
      - { label: "Les plus", name: plus, widget: text, required: false, i18n: true }
      - { label: "Les moins", name: moins, widget: text, required: false, i18n: true }
      - { label: "Repères (petites étiquettes)", name: reperes, widget: list, required: false, hint: "Ex. : 24 995 €, 450 km, Made in Espagne", i18n: true }
      - { label: "Renvoi vers une fiche À bord", name: lien_abord, widget: relation, collection: articles, search_fields: [titre], value_field: "{{slug}}", display_fields: [titre], required: false, filters: [{ field: rubrique, values: [watt-a-bord] }], i18n: duplicate }
      - { label: "Galerie « Plus de photos »", name: galerie, widget: list, required: false, field: { label: Photo, name: photo, widget: image }, i18n: duplicate }
      - label: "Encadré de chiffres (fiches À bord)"
        name: chiffres
        i18n: true
        widget: list
        required: false
        summary: "{{fields.label}} : {{fields.valeur}}"
        fields:
          - { label: Libellé, name: label, widget: string }
          - { label: Valeur, name: valeur, widget: string }
      - { label: "Titre de l'encadré", name: encadre_titre, widget: string, required: false, default: "Les chiffres", i18n: true }
      - { label: "Prix (encadré)", name: prix, widget: string, required: false, i18n: true }
      - { label: "Précision sous le prix", name: prix_note, widget: string, required: false, i18n: true }
      - { label: "Note en bas de l'encadré", name: encadre_note, widget: string, required: false, i18n: true }
      - { label: "Mettre à la une (carrousel)", name: une, widget: boolean, required: false, default: false, i18n: duplicate }
      - { label: "Position dans le carrousel", name: une_ordre, widget: number, required: false, value_type: int, min: 1, i18n: duplicate }
      - { label: "Titre dans le carrousel", name: une_titre, widget: string, required: false, i18n: true }
      - { label: "Texte dans le carrousel", name: une_texte, widget: text, required: false, i18n: true }
      - { label: "Photo du carrousel (paysage, sans fond blanc)", name: une_image, widget: image, required: false, i18n: duplicate }
      - { label: "Brouillon (ne pas publier)", name: brouillon, widget: boolean, required: false, default: false, i18n: duplicate }

  - name: comparatifs
    label: Comparatifs
    label_singular: comparatif
    folder: content/comparatifs
    i18n: true
    create: true
    slug: "{{slug}}"
    summary: "{{titre}} · {{date}}"
    fields:
      - { label: Titre, name: titre, widget: string, i18n: true, required: false, hint: "Obligatoire en français. En anglais, laissez vide pour garder la version française." }
      - { label: "Date de publication", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, i18n: duplicate }
      - { label: "Introduction", name: chapo, widget: text, required: false, i18n: true }
      - { label: "Note (méthode, précisions)", name: note, widget: text, required: false, i18n: true }
      - { label: "Noms des colonnes du tableau (un par modèle, dans l'ordre)", name: colonnes, widget: list, required: false, i18n: duplicate }
      - label: "Tableau"
        name: tableau
        i18n: true
        widget: list
        required: false
        summary: "{{fields.critere}}"
        fields:
          - { label: Critère, name: critere, widget: string }
          - label: "Valeurs (une par modèle, dans l'ordre des colonnes)"
            name: valeurs
            widget: list
            summary: "{{fields.v}}"
            fields:
              - { label: Valeur, name: v, widget: string }
              - { label: "Meilleur de la ligne", name: meilleur, widget: boolean, required: false, default: false }
      - label: "Modèles (dans l'ordre du classement)"
        name: modeles
        i18n: true
        widget: list
        summary: "{{fields.nom}}"
        fields:
          - { label: Nom, name: nom, widget: string }
          - { label: "Étiquette", name: etiquette, widget: string, required: false, hint: "Ex. : Le plus complet" }
          - { label: Photo, name: image, widget: image, required: false }
          - { label: "Crédit photo", name: credit, widget: string, required: false }
          - { label: Texte, name: texte, widget: text }
          - { label: "Les plus", name: plus, widget: text, required: false }
          - { label: "Les moins", name: moins, widget: text, required: false }
          - { label: "Prix de départ", name: prix, widget: string, required: false }
          - { label: "Photos supplémentaires", name: galerie, widget: list, required: false, field: { label: Photo, name: photo, widget: image } }
      - { label: "Titre de l'encadré conseils", name: conseils_titre, widget: string, required: false, default: "Laquelle pour vous ?", i18n: true }
      - label: Conseils
        name: conseils
        i18n: true
        widget: list
        required: false
        summary: "{{fields.profil}}"
        fields:
          - { label: Profil, name: profil, widget: string }
          - { label: Conseil, name: conseil, widget: string }
