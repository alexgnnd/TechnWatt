backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Nouvel article : {{slug}}"
    update: "Modification : {{slug}}"
    delete: "Suppression : {{slug}}"
    uploadMedia: "Photo ajoutée : {{path}}"
    deleteMedia: "Photo supprimée : {{path}}"

locale: fr
site_url: /
display_url: /
logo_url: /img/logo-admin.svg
media_folder: img
public_folder: /img

collections:
  - name: articles
    label: Articles
    label_singular: article
    folder: content/articles/fr
    create: true
    slug: "{{slug}}"
    summary: "{{titre}} · {{rubrique}} · {{date}}"
    sortable_fields: [date, titre, rubrique]
    view_filters:
      - { label: "Watt · Actualités", field: rubrique, pattern: watt-actualites }
      - { label: "Watt · À bord", field: rubrique, pattern: watt-a-bord }
      - { label: "Tech · Smartphones", field: rubrique, pattern: tech-smartphones }
      - { label: "Tech · Objets connectés", field: rubrique, pattern: tech-objets }
      - { label: "Tech · Vidéoprojecteurs", field: rubrique, pattern: tech-videoprojecteurs }
      - { label: "À la une", field: une, pattern: true }
      - { label: "Brouillons", field: brouillon, pattern: true }
    fields:
      - { label: Titre, name: titre, widget: string, required: false, hint: "Titre de l'article" }
      - label: Rubrique
        name: rubrique
        widget: select
        options:
          - { label: "Watt · Actualités", value: watt-actualites }
          - { label: "Watt · À bord", value: watt-a-bord }
          - { label: "Tech · Smartphones", value: tech-smartphones }
          - { label: "Tech · Objets connectés", value: tech-objets }
          - { label: "Tech · Vidéoprojecteurs", value: tech-videoprojecteurs }
      - { label: "Date de publication", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Les articles les plus récents s'affichent en premier." }
      - { label: "Catégorie (ou marque pour À bord)", name: categorie, widget: string, required: false, hint: "Ex. : Nouveau modèle, Smartphone, Renault…" }
      - { label: "Infos sous le titre (À bord)", name: infos, widget: string, required: false, hint: "Ex. : Citadine · Made in Slovénie" }
      - { label: "Photo principale", name: image, widget: image, required: false }
      - { label: "Crédit photo", name: credit, widget: string, required: false, hint: "Ex. : Renault (le © est ajouté automatiquement)" }
      - { label: "Picto (si pas de photo)", name: picto, widget: select, required: false, options: [{ label: "Montre", value: montre }, { label: "Vidéoprojecteur", value: videoprojecteur }, { label: "Smartphone", value: smartphone }, { label: "Smartphone-clé", value: cle }, { label: "Borne de recharge", value: borne }, { label: "Carte", value: carte }], hint: "Affiché à la place de la photo tant qu'il n'y en a pas." }
      - { label: "Chapô (introduction)", name: chapo, widget: text, required: false }
      - { label: "Texte de l'article", name: body, widget: markdown, buttons: [bold, italic, link, heading-two, bulleted-list], editor_components: [image], hint: "Utilisez « Titre 2 » pour les intertitres. Insérez les photos à l'endroit voulu." }
      - { label: "Les plus", name: plus, widget: text, required: false }
      - { label: "Les moins", name: moins, widget: text, required: false }
      - { label: "Repères (petites étiquettes)", name: reperes, widget: list, required: false, hint: "Ex. : 24 995 €, 450 km, Made in Espagne" }
      - { label: "Renvoi vers une fiche À bord", name: lien_abord, widget: relation, collection: articles, search_fields: [titre], value_field: "{{slug}}", display_fields: [titre], required: false, filters: [{ field: rubrique, values: [watt-a-bord] }] }
      - { label: "Galerie « Plus de photos »", name: galerie, widget: list, required: false, field: { label: Photo, name: photo, widget: image } }
      - label: "Encadré de chiffres (fiches À bord)"
        name: chiffres
        widget: list
        required: false
        summary: "{{fields.label}} : {{fields.valeur}}"
        fields:
          - { label: Libellé, name: label, widget: string }
          - { label: Valeur, name: valeur, widget: string }
      - { label: "Titre de l'encadré", name: encadre_titre, widget: string, required: false, default: "Les chiffres" }
      - { label: "Prix (encadré)", name: prix, widget: string, required: false }
      - { label: "Précision sous le prix", name: prix_note, widget: string, required: false }
      - { label: "Note en bas de l'encadré", name: encadre_note, widget: string, required: false }
      - { label: "Mettre à la une (carrousel)", name: une, widget: boolean, required: false, default: false }
      - { label: "Position dans le carrousel", name: une_ordre, widget: number, required: false, value_type: int, min: 1 }
      - { label: "Titre dans le carrousel", name: une_titre, widget: string, required: false }
      - { label: "Texte dans le carrousel", name: une_texte, widget: text, required: false }
      - { label: "Photo du carrousel (paysage, sans fond blanc)", name: une_image, widget: image, required: false }
      - { label: "Brouillon (ne pas publier)", name: brouillon, widget: boolean, required: false, default: false }

  - name: comparatifs
    label: Comparatifs
    label_singular: comparatif
    folder: content/comparatifs/fr
    create: true
    slug: "{{slug}}"
    summary: "{{titre}} · {{date}}"
    fields:
      - { label: Titre, name: titre, widget: string, required: false, hint: "Titre de l'article" }
      - { label: "Date de publication", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Introduction", name: chapo, widget: text, required: false }
      - { label: "Note (méthode, précisions)", name: note, widget: text, required: false }
      - { label: "Noms des colonnes du tableau (un par modèle, dans l'ordre)", name: colonnes, widget: list, required: false }
      - label: "Tableau"
        name: tableau
        widget: list
        required: false
        summary: "{{fields.critere}}"
        fields:
          - { label: Critère, name: critere, widget: string }
          - label: "Valeurs (une par modèle, dans l'ordre des colonnes)"
            name: valeurs
            widget: list
            summary: "{{fields.v}}"
            fields:
              - { label: Valeur, name: v, widget: string }
              - { label: "Meilleur de la ligne", name: meilleur, widget: boolean, required: false, default: false }
      - label: "Modèles (dans l'ordre du classement)"
        name: modeles
        widget: list
        summary: "{{fields.nom}}"
        fields:
          - { label: Nom, name: nom, widget: string }
          - { label: "Étiquette", name: etiquette, widget: string, required: false, hint: "Ex. : Le plus complet" }
          - { label: Photo, name: image, widget: image, required: false }
          - { label: "Crédit photo", name: credit, widget: string, required: false }
          - { label: Texte, name: texte, widget: text }
          - { label: "Les plus", name: plus, widget: text, required: false }
          - { label: "Les moins", name: moins, widget: text, required: false }
          - { label: "Prix de départ", name: prix, widget: string, required: false }
          - { label: "Photos supplémentaires", name: galerie, widget: list, required: false, field: { label: Photo, name: photo, widget: image } }
      - { label: "Titre de l'encadré conseils", name: conseils_titre, widget: string, required: false, default: "Laquelle pour vous ?" }
      - label: Conseils
        name: conseils
        widget: list
        required: false
        summary: "{{fields.profil}}"
        fields:
          - { label: Profil, name: profil, widget: string }
          - { label: Conseil, name: conseil, widget: string }

  - name: guide
    label: "Le guide de la voiture électrique"
    files:
      - name: guide
        label: "Contenu du guide"
        file: content/guide.yml
        fields:
          - label: "Sections"
            name: sections
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { label: "Identifiant (ne pas modifier)", name: id, widget: string }
              - { label: "Étiquette", name: tag, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Chapô", name: chapo, widget: text, required: false }
              - { label: "Photo", name: image, widget: image, required: false }
              - { label: "Crédit photo", name: credit, widget: string, required: false }
          - label: "Idées reçues"
            name: idees
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: "Idée reçue", name: question, widget: string }
              - { label: "Réponse", name: reponse, widget: text }
          - label: "Glossaire"
            name: glossaire
            widget: list
            summary: "{{fields.terme}}"
            fields:
              - { label: "Terme", name: terme, widget: string }
              - { label: "Définition", name: definition, widget: text }

  - name: reglages
    label: Réglages
    files:
      - name: reglages
        label: "Réglages du site et publicité"
        file: content/reglages.yml
        fields:
          - { label: "Adresse du site", name: site_url, widget: string, hint: "Ex. : https://www.technwatt.fr une fois le nom de domaine acheté" }
          - { label: "Responsable de la publication", name: editeur, widget: string, required: false, hint: "Affiché dans les mentions légales" }
          - { label: "E-mail de contact", name: contact, widget: string, required: false }
          - { label: "Tag affilié Amazon", name: "amazon_tag", widget: "string", required: false, hint: "Ex. technwatt-21 — laisser vide tant que le compte Amazon Partenaires n'est pas validé" }
          - { label: "Identifiant Google Analytics (G-…)", name: ga_id, widget: string, required: false, hint: "Ex. G-AB12CD34EF — laisser vide pour désactiver la mesure d'audience" }
          - { label: "Identifiant AdSense (ca-pub-…)", name: adsense_client, widget: string, required: false, hint: "Laisser vide tant que le compte AdSense n'est pas validé : aucune pub ne s'affiche." }
          - { label: "Bloc pub · page d'accueil (data-ad-slot)", name: pub_accueil, widget: string, required: false }
          - { label: "Bloc pub · fin d'article (data-ad-slot)", name: pub_article, widget: string, required: false }
          - { label: "Bloc pub · bas de rubrique (data-ad-slot)", name: pub_rubrique, widget: string, required: false }
